name: 과제 자동 채점 및 알림 (Auto Grading & Slack Notification)

on:
  pull_request_target:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: '채점할 PR 번호'
        required: true
        default: '20'

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  grade-and-notify:
    # pull_request_target일 때는 base가 main인 경우만 실행 (workflow_dispatch는 항상 실행)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃 (스크립트 로드용)
        uses: actions/checkout@v4

      - name: GitHub CLI 인증 설정
        run: echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: PR 정보 및 변경사항(diff) 수집
        id: pr_data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            PR_JSON=$(gh pr view "$PR_NUMBER" --json number,title,author,url)
            PR_TITLE=$(echo "$PR_JSON" | jq -r .title)
            PR_AUTHOR=$(echo "$PR_JSON" | jq -r .author.login)
            PR_URL=$(echo "$PR_JSON" | jq -r .url)
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_AUTHOR="${{ github.event.pull_request.user.login }}"
            PR_URL="${{ github.event.pull_request.html_url }}"
          fi
          
          # PR 본문 추출
          gh pr view "$PR_NUMBER" --json body -q .body > pr_body.txt
          
          # diff 추출 (최대 1000줄로 제한하여 토큰 절약)
          gh pr diff "$PR_NUMBER" | head -n 1000 > pr_diff.txt

          # 환경변수 저장
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_AUTHOR=$PR_AUTHOR" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Gemini API 자동 채점 및 피드백 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_AUTHOR: ${{ env.PR_AUTHOR }}
        run: node .github/scripts/grade.js

      - name: PR에 채점 코멘트 등록 및 PR 자동 Close
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          
          # 평가 코멘트 등록
          gh pr comment "$PR_NUMBER" --body-file result_comment.txt
          
          # PR 자동 Close 처리 (과제 접수 완료)
          gh pr close "$PR_NUMBER" --comment "🎉 과제 제출 및 자동 채점 검토가 완료되어 PR을 자동으로 Close합니다. 수고 많으셨습니다!"

      - name: Slack 채널 알림 발송
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ env.PR_URL }}
          PR_AUTHOR: ${{ env.PR_AUTHOR }}
          PR_TITLE: ${{ env.PR_TITLE }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL이 설정되어 있지 않아 알림을 건너뜁니다."
            exit 0
          fi
          
          SUMMARY=$(cat summary.txt 2>/dev/null || echo "과제 채점 완료")
          
          # Slack 알림 전송 (JSON 안전 생성)
          PAYLOAD=$(jq -nc \
            --arg text "📬 [웹콘텐츠 제작] 새 과제 제출: ${PR_AUTHOR} - ${SUMMARY} (${PR_URL})" \
            '{"text": $text}')
          
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
